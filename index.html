<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mellie's Corner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" id="stage">
    <img class="background" src="assets/mellies-corner.png" alt="Mellie's Corner desk scene">

    <a class="window" id="window-1" data-window="window-1" data-kind="screen" href="#" target="_blank" rel="noopener" style="left:33.60%; top:37.59%; width:29.06%; height:28.21%;">
      <div class="pick-card"></div>
    </a>

    <a class="window" id="window-2" data-window="window-2" data-kind="paper" href="#" target="_blank" rel="noopener" style="left:42.97%; top:11.21%; width:10.13%; height:19.67%;">
      <div class="pick-card"></div>
    </a>

    <a class="window" id="window-3" data-window="window-3" data-kind="screen" data-shape="phone" href="#" target="_blank" rel="noopener" style="left:55.91%; top:75.17%; width:12.31%; height:12.34%;">
      <div class="pick-card"></div>
    </a>

    <a class="window window-rotated" id="window-4" data-window="window-4" data-kind="paper" href="#" target="_blank" rel="noopener" style="left:36.34%; top:23.81%; width:7.68%; height:14.75%; --angle: 5.9deg;">
      <div class="pick-card"></div>
    </a>

    <a class="window" id="window-5" data-window="window-5" data-kind="paper" href="#" target="_blank" rel="noopener" style="left:69.91%; top:67.30%; width:3.82%; height:7.69%;">
      <div class="pick-card"></div>
    </a>
  </div>

  <script src="script.js"></script>
</body>
</html>
